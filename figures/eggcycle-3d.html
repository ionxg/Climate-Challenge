<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EggCycle 3D Model</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffffd9; --text: #23211d; --muted: #6b665c;
    --line: #d9d3c6; --accent: #3f8f4f; --label-bg: #ffffffe6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --panel: #23252ad9; --text: #ecebe7; --muted: #a29f97;
      --line: #3a3c41; --accent: #6cc27c; --label-bg: #23252ae6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --panel: #23252ad9; --text: #ecebe7; --muted: #a29f97;
    --line: #3a3c41; --accent: #6cc27c; --label-bg: #23252ae6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  header {
    position: fixed; top: 16px; left: 16px; right: 16px; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; backdrop-filter: blur(6px); pointer-events: auto; max-width: 340px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .card p { margin: 0; color: var(--muted); }
  .specs { margin: 8px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 13px; }
  .specs b { color: var(--text); font-weight: 600; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  button {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; pointer-events: auto;
  }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .label {
    position: absolute; transform: translate(10px, -50%); white-space: nowrap;
    background: var(--label-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 3px 8px; font-size: 12.5px; transition: opacity .15s;
  }
  .label::before {
    content: ""; position: absolute; left: -14px; top: 50%; width: 8px; height: 8px;
    margin-top: -4px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 2px var(--bg);
  }
  .label small { display: block; color: var(--muted); font-size: 11px; }
  .hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; pointer-events: none; text-align: center;
  }
  @media (max-width: 640px) {
    header { flex-direction: column; }
    .card { max-width: none; width: 100%; }
    .specs { display: none; }
    .controls { justify-content: flex-start; }
    .label { font-size: 11px; }
    .label small { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<header>
  <div class="card">
    <h1>🥚 EggCycle</h1>
    <p>Home food-waste digester: scraps in, power at the plug, soil out.</p>
    <ul class="specs">
      <li><b>Egg:</b> 90 cm tall × 60 cm wide, ~170 L (≈115 L slurry + gas dome)</li>
      <li><b>Overall:</b> ~1.55 m tall, 80 cm base</li>
      <li><b>Feeds:</b> ~1 kg scraps/day → ~0.25 kWh/day</li>
    </ul>
  </div>
  <div class="controls">
    <button id="btn-xray" aria-pressed="false">X-ray</button>
    <button id="btn-labels" aria-pressed="true">Labels</button>
    <button id="btn-spin" aria-pressed="true">Spin</button>
    <button id="btn-reset">Reset view</button>
  </div>
</header>
<div class="hint">Drag to rotate · scroll or pinch to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 50);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f6a, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(2, 4, 3);
  scene.add(sun);

  // ---- Materials --------------------------------------------------------------------------
  const mat = (color, extra = {}) =>
    new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, ...extra });
  const M = {
    shell: mat(0xf1e8d5, { roughness: 0.4, transparent: true }),
    base: mat(0x7d8f74, { transparent: true }),
    dark: mat(0x2b2d31),
    metal: mat(0xa9adb3, { metalness: 0.6, roughness: 0.35 }),
    red: mat(0xc8453a),
    yellow: mat(0xe0b43c),
    glow: mat(0x6cc27c, { emissive: 0x3f9f50, emissiveIntensity: 0.9 }),
    screen: mat(0x1f3d2a, { emissive: 0x2f7d45, emissiveIntensity: 0.7 }),
    slurry: mat(0x6b4f2e, { transparent: true, opacity: 0.9 }),
    gas: mat(0xf3df87, { transparent: true, opacity: 0.35, depthWrite: false }),
    bag: mat(0xf0cf5a, { transparent: true, opacity: 0.6 }),
    battery: mat(0x2f5d8a),
    gen: mat(0x5d6168),
  };

  const add = (geo, material, pos = [0, 0, 0], rot = [0, 0, 0], parent = scene) => {
    const m = new THREE.Mesh(geo, material);
    m.position.set(...pos);
    m.rotation.set(...rot);
    parent.add(m);
    return m;
  };
  const tube = (pts, r, material) =>
    add(new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), 48, r, 12), material);

  // ---- Egg profile (same as hardware/eggcycle.scad) ----------------------------------------
  const R = 0.30, H = 0.90, A = 0.12, YC = 1.01;  // radius, height, taper, centre height (m)
  const eggR = t => R * Math.sqrt(Math.max(0, 1 - t * t)) * (1 - A * t);
  const eggPts = (scale = 1, tMax = 1) => {
    const pts = [];
    for (let i = 0; i <= 64; i++) {
      const t = -1 + (tMax + 1) * i / 64;
      pts.push(new THREE.Vector2(eggR(t) * scale, YC + H / 2 * t * scale));
    }
    if (tMax < 1) pts.push(new THREE.Vector2(0, YC + H / 2 * tMax * scale));
    return pts;
  };
  const yAt = t => YC + H / 2 * t;

  // Shell + status band
  const egg = add(new THREE.LatheGeometry(eggPts(), 96), M.shell);
  add(new THREE.TorusGeometry(eggR(0) + 0.004, 0.008, 12, 96), M.glow, [0, YC, 0], [Math.PI / 2, 0, 0]);

  // Inside (X-ray): slurry up to ~65% height, gas dome above
  const FILL_T = 0.3;
  const inside = new THREE.Group();
  scene.add(inside);
  add(new THREE.LatheGeometry(eggPts(0.96, FILL_T), 96), M.slurry, [0, 0, 0], [0, 0, 0], inside);
  add(new THREE.LatheGeometry(eggPts(0.95), 96), M.gas, [0, 0, 0], [0, 0, 0], inside);

  // ---- Base pod: gas bag, battery, plug ---------------------------------------------------
  const base = add(new THREE.CylinderGeometry(0.40, 0.42, 0.50, 72), M.base, [0, 0.25, 0]);
  add(new THREE.TorusGeometry(0.40, 0.012, 10, 72), M.base, [0, 0.5, 0], [Math.PI / 2, 0, 0]);
  const pod = new THREE.Group();
  scene.add(pod);
  add(new THREE.SphereGeometry(1, 40, 20), M.bag, [0, 0.33, -0.04], [0, 0, 0], pod).scale.set(0.33, 0.12, 0.30);
  add(new THREE.BoxGeometry(0.30, 0.13, 0.16), M.battery, [0, 0.09, 0.18], [0, 0, 0], pod);
  add(new THREE.BoxGeometry(0.04, 0.02, 0.04), M.dark, [0, 0.48, -0.04], [0, 0, 0], pod); // ToF sensor

  // Plug panel on the front of the base
  const panelZ = 0.405;
  add(new THREE.BoxGeometry(0.34, 0.17, 0.04), M.dark, [0, 0.27, panelZ - 0.01]);
  for (const x of [-0.1, 0.0]) {
    add(new THREE.CylinderGeometry(0.035, 0.035, 0.012, 32), M.metal, [x, 0.27, panelZ + 0.012], [Math.PI / 2, 0, 0]);
    for (const dx of [-0.012, 0.012])
      add(new THREE.CylinderGeometry(0.005, 0.005, 0.014, 10), M.dark, [x + dx, 0.27, panelZ + 0.014], [Math.PI / 2, 0, 0]);
  }
  for (const y of [0.295, 0.245])
    add(new THREE.BoxGeometry(0.035, 0.013, 0.012), M.metal, [0.11, y, panelZ + 0.012]);
  add(new THREE.BoxGeometry(0.2, 0.06, 0.02), M.screen, [0, 0.41, panelZ - 0.005]);

  // ESP32 sensor hub on the side
  add(new THREE.BoxGeometry(0.06, 0.12, 0.09), M.dark, [0.42, 0.36, 0.05]);
  add(new THREE.CylinderGeometry(0.004, 0.004, 0.09, 8), M.dark, [0.42, 0.46, 0.08]);

  // ---- Cradle --------------------------------------------------------------------------
  const ringY = yAt(-0.8);
  add(new THREE.TorusGeometry(eggR(-0.8) + 0.01, 0.018, 12, 64), M.metal, [0, ringY, 0], [Math.PI / 2, 0, 0]);
  for (let i = 0; i < 3; i++) {
    const a = i * 2 * Math.PI / 3 + Math.PI / 2;
    const r = eggR(-0.8) + 0.01;
    tube([[Math.cos(a) * r, ringY, Math.sin(a) * r], [Math.cos(a) * (r + 0.05), 0.5, Math.sin(a) * (r + 0.05)]], 0.014, M.metal);
  }

  // ---- Food inlet + hopper (on a load cell) ----------------------------------------------
  const inT = 0.45, inY = yAt(inT), inR = eggR(inT);
  const inlet = new THREE.Group();
  inlet.position.set(0, inY, inR - 0.02);
  inlet.rotation.x = Math.PI / 4;
  scene.add(inlet);
  add(new THREE.CylinderGeometry(0.06, 0.06, 0.16, 32), M.metal, [0, 0.08, 0], [0, 0, 0], inlet);
  add(new THREE.CylinderGeometry(0.13, 0.065, 0.11, 40, 1, true), M.shell, [0, 0.21, 0], [0, 0, 0], inlet);
  add(new THREE.CylinderGeometry(0.135, 0.135, 0.015, 40), M.base, [0, 0.27, -0.03], [-0.35, 0, 0], inlet);
  add(new THREE.BoxGeometry(0.05, 0.02, 0.03), M.dark, [0, 0.27, 0.13], [0, 0, 0], inlet); // lid handle

  // ---- Gas out: top valve, relief valve, H2S filter, pipe to the base -------------------
  const topY = yAt(1);
  add(new THREE.CylinderGeometry(0.03, 0.04, 0.05, 24), M.metal, [0, topY + 0.015, 0]);
  add(new THREE.BoxGeometry(0.09, 0.012, 0.02), M.red, [0, topY + 0.05, 0]);              // gas valve
  add(new THREE.CylinderGeometry(0.014, 0.014, 0.06, 16), M.metal, [0.05, topY - 0.01, 0]);
  add(new THREE.CylinderGeometry(0.022, 0.022, 0.02, 16), M.yellow, [0.05, topY + 0.03, 0]); // relief valve
  const filterZ = -0.36, filterY = 0.64;
  tube([[0, topY + 0.04, -0.02], [0, topY + 0.06, -0.12], [0, yAt(0.4), -0.33],
        [0, yAt(-0.2), -0.36], [0, filterY + 0.16, filterZ]], 0.012, M.metal);
  add(new THREE.CylinderGeometry(0.05, 0.05, 0.26, 32), M.yellow, [0, filterY, filterZ]);

  // ---- Digestate tap -------------------------------------------------------------------
  const botY = yAt(-1);
  tube([[0, botY + 0.01, 0], [0, botY - 0.02, 0.06], [0, 0.535, 0.2], [0, 0.535, 0.45]], 0.018, M.metal);
  add(new THREE.CylinderGeometry(0.03, 0.03, 0.05, 20), M.metal, [0, 0.535, 0.46], [Math.PI / 2, 0, 0]);
  add(new THREE.BoxGeometry(0.1, 0.012, 0.02), M.red, [0, 0.57, 0.46]);                   // tap handle
  add(new THREE.CylinderGeometry(0.016, 0.016, 0.07, 16), M.metal, [0, 0.5, 0.475]);       // spout

  // ---- Generator module (behind) -------------------------------------------------------
  add(new THREE.BoxGeometry(0.46, 0.40, 0.34), M.gen, [0, 0.2, -0.6]);
  for (let i = 0; i < 5; i++)
    add(new THREE.BoxGeometry(0.30, 0.012, 0.01), M.dark, [0, 0.12 + i * 0.04, -0.43]);   // vents
  add(new THREE.CylinderGeometry(0.025, 0.025, 0.35, 16), M.dark, [0.17, 0.57, -0.7]);    // exhaust
  tube([[0, 0.3, -0.42], [0, 0.3, -0.39]], 0.012, M.dark);

  // Ground
  const ground = add(new THREE.CircleGeometry(1.4, 64), new THREE.MeshBasicMaterial({
    color: 0x000000, transparent: true, opacity: 0.06, depthWrite: false }), [0, 0.001, 0], [-Math.PI / 2, 0, 0]);

  // ---- Labels --------------------------------------------------------------------------
  const labels = [
    ['Food inlet + hopper', 'load cell weighs every feed', [0, inY + 0.2, inR + 0.17]],
    ['Status band', 'glows with gas level', [eggR(0) * 0.7, YC, eggR(0) * 0.72]],
    ['Gas valve + relief valve', 'vents safely if over-pressure', [0.05, topY + 0.05, 0]],
    ['H₂S filter', 'iron sponge, removes toxic gas', [0, filterY, filterZ - 0.05]],
    ['Power plug + display', '2× AC + 2× USB · shows kWh and days to soil', [0.15, 0.27, panelZ + 0.02]],
    ['Digestate tap', 'drain → cure 14 days → soil', [0, 0.5, 0.5]],
    ['Biogas generator', 'charges the battery; exhaust outdoors', [0.23, 0.3, -0.6]],
    ['ESP32 sensor hub', 'Wi-Fi to the EggCycle app', [0.45, 0.4, 0.05]],
    ['Slurry ~115 L', '21 days at 30–35 °C', [eggR(-0.3) * 0.6, yAt(-0.3), eggR(-0.3) * 0.6], true],
    ['Gas dome', 'biogas collects at the top', [0, yAt(0.65), 0.1], true],
    ['150 L gas bag', 'level read by ToF sensor', [-0.22, 0.36, 0.05], true],
    ['Battery + inverter', 'feeds the plug', [0.12, 0.09, 0.26], true],
  ].map(([title, sub, p, xrayOnly]) => {
    const el = document.createElement('div');
    el.className = 'label';
    el.innerHTML = `${title}<small>${sub}</small>`;
    document.getElementById('labels').appendChild(el);
    return { el, pos: new THREE.Vector3(...p), xrayOnly: !!xrayOnly };
  });

  // ---- State + controls ----------------------------------------------------------------
  const state = { xray: false, labels: true, spin: true };
  const view = { az: 0.6, el: 0.28, dist: 3.6 };
  const target = new THREE.Vector3(0, 0.72, 0);

  function applyXray() {
    M.shell.opacity = state.xray ? 0.22 : 1;
    M.shell.depthWrite = !state.xray;
    M.base.opacity = state.xray ? 0.25 : 1;
    M.base.depthWrite = !state.xray;
    inside.visible = pod.visible = state.xray;
  }
  function toggle(id, key, after) {
    const btn = document.getElementById(id);
    btn.addEventListener('click', () => {
      state[key] = !state[key];
      btn.setAttribute('aria-pressed', state[key]);
      after && after();
    });
  }
  toggle('btn-xray', 'xray', applyXray);
  toggle('btn-labels', 'labels');
  toggle('btn-spin', 'spin');
  document.getElementById('btn-reset').addEventListener('click', () => Object.assign(view, { az: 0.6, el: 0.28, dist: 3.6 }));

  // URL options for screenshots/slides, e.g. eggcycle-3d.html?xray=1&spin=0&az=0.4
  const q = new URLSearchParams(location.search);
  for (const key of ['xray', 'labels', 'spin']) {
    if (q.has(key)) {
      state[key] = q.get(key) === '1';
      document.getElementById(`btn-${key}`).setAttribute('aria-pressed', state[key]);
    }
  }
  if (q.has('az')) view.az = Number(q.get('az'));
  applyXray();

  const pointers = new Map();
  let pinchStart = 0;
  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = Math.hypot(a[0] - b[0], a[1] - b[1]) / view.dist;
    }
    stopSpin();
  });
  stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const [px, py] = pointers.get(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      view.dist = clampDist(Math.hypot(a[0] - b[0], a[1] - b[1]) / pinchStart);
    } else {
      view.az -= (e.clientX - px) * 0.008;
      view.el = Math.max(-0.2, Math.min(1.3, view.el + (e.clientY - py) * 0.006));
    }
  });
  const release = e => pointers.delete(e.pointerId);
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    view.dist = clampDist(view.dist * Math.exp(e.deltaY * 0.001));
  }, { passive: false });
  function clampDist(d) { return Math.max(1.6, Math.min(7, d)); }
  function stopSpin() {
    state.spin = false;
    document.getElementById('btn-spin').setAttribute('aria-pressed', 'false');
  }

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = w < 640 ? 48 : 35;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  const tmp = new THREE.Vector3(), camDir = new THREE.Vector3();
  function frame() {
    if (state.spin) view.az += 0.003;
    camera.position.set(
      target.x + view.dist * Math.cos(view.el) * Math.sin(view.az),
      target.y + view.dist * Math.sin(view.el),
      target.z + view.dist * Math.cos(view.el) * Math.cos(view.az));
    camera.lookAt(target);
    renderer.render(scene, camera);

    camDir.subVectors(camera.position, target).setY(0).normalize();
    for (const l of labels) {
      const show = state.labels && (!l.xrayOnly || state.xray);
      if (!show) { l.el.style.opacity = 0; continue; }
      // Fade labels on the far side of the egg.
      const facing = tmp.set(l.pos.x, 0, l.pos.z).normalize().dot(camDir);
      tmp.copy(l.pos).project(camera);
      l.el.style.left = `${(tmp.x + 1) / 2 * innerWidth}px`;
      l.el.style.top = `${(1 - tmp.y) / 2 * innerHeight}px`;
      l.el.style.opacity = l.xrayOnly || facing > -0.15 ? 1 : 0.12;
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
